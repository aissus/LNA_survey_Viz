[project]
name = "survey-viz"
version = "0.1.0"
description = "Build-time data pipeline for the static IC block survey visualizer"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
