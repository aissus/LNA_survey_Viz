name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --- data pipeline (Python) ---------------------------------------------
      - uses: astral-sh/setup-uv@v10.3.1
      # Survey spreadsheets that are not committed are downloaded by the build
      # (SurveySource.url, checked against a pinned sha256). Cache them, keyed
      # on the source definitions, so each run does not fetch them from ETH.
      - uses: actions/cache@v6
        with:
          path: |
            sources/phased_array
            sources/pa
          key: survey-sources-${{ hashFiles('scripts/source_*.py') }}
      - name: Test the data pipeline
        run: uv run pytest
      - name: Build site/data/*.json from the survey spreadsheets
        run: uv run scripts/build_data.py

      # --- viewer (type check + unit tests; nothing is bundled) ---------------
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check the viewer (JSDoc)
        run: npm run typecheck
      - name: Viewer unit tests
        run: npm test

      # --- publish only site/ (not the repo root, not the source xlsx) --------
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
